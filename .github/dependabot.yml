# E5 round 2 — the proposed fix: a directories glob that also covers composite
# actions under .github/actions/*.
#
# Round 1 (exact replica of the gha-workflows config, directory "/") confirmed
# the blind spot: PR #1 bumped the workflow canary only; the composite carrying
# the identical old ref got nothing.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
