# Diagnostic: why did "Push image to registry" get 403 from GHCR?
#
# The build run failed with 403 Forbidden on a HEAD to
# /v2/duynhlab/action-test/action-test/blobs/<digest>. A 403 rather than a 404
# means the token was not authorised for that repository namespace at all, so
# this probe asks GHCR's token endpoint what scope it actually grants, and then
# attempts real pushes.
#
# Two environment constraints shape this file:
#   1. Everything runs in the runner, because that is where GITHUB_TOKEN has
#      package permissions.
#   2. Results are emitted as ::warning:: annotations, not just step summaries,
#      because the log/summary blobs are unreachable from the analysis
#      environment while the annotations REST API is not.
#
# Runs on pushes to the `probe` branch: workflow_dispatch only appears once a
# workflow is on the default branch, and build.yml triggers on dev/uat/main, so a
# dedicated branch keeps this diagnostic from kicking off a full build.

name: E0 GHCR probe

on:
  push:
    branches: [probe]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    name: GHCR probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask GHCR what scope it grants
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The default GitHub shell is `bash -e`, so every command whose failure
          # is expected has to be neutralised explicitly.
          set -uo pipefail

          probe_scope() {
            label="$1"
            scope="$2"
            set +e
            body=$(curl -sS -u "token:${GH_TOKEN}" "https://ghcr.io/token?service=ghcr.io&scope=${scope}")
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::SCOPE ${label} | curl failed rc=${rc}"
              return 0
            fi
            granted=$(printf '%s' "$body" | jq -r 'if .scope then .scope elif .errors then "ERROR: " + (.errors[0].message // "unknown") else "(no scope field)" end')
            echo "::warning::SCOPE ${label} | requested=${scope} | granted=${granted}"
          }

          probe_scope "2-level"       "repository:duynhlab/probe-2level:pull,push"
          probe_scope "3-level"       "repository:duynhlab/action-test/probe-3level:pull,push"
          probe_scope "3-level-real"  "repository:duynhlab/action-test/action-test:pull,push"
          probe_scope "read-only"     "repository:duynhlab/action-test/action-test:pull"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a tiny image once
        run: |
          set -euo pipefail
          printf 'FROM alpine:3.21\nRUN echo probe > /probe\n' > Dockerfile.probe
          docker build -q -f Dockerfile.probe -t probe:local .

      - name: Try pushing to each path shape
        run: |
          set -uo pipefail

          try_push() {
            label="$1"
            ref="$2"
            docker tag probe:local "$ref"
            set +e
            out=$(docker push "$ref" 2>&1)
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "::warning::PUSH ${label} | ${ref} | OK"
            else
              msg=$(printf '%s' "$out" | tr '\n' ' ' | sed 's/  */ /g' | tail -c 220)
              echo "::warning::PUSH ${label} | ${ref} | FAILED rc=${code} | ${msg}"
            fi
            echo "--- ${label} (exit ${code}) ---"
            printf '%s\n' "$out"
          }

          # Only push inside this repo's own namespace. A 2-level push would
          # create an org-level package with no repo link, which needs org admin
          # to delete — the scope probe above already covers that shape.
          try_push "3-level"      "ghcr.io/duynhlab/action-test/probe-3level:t1"
          try_push "3-level-real" "ghcr.io/duynhlab/action-test/action-test:probe"

          # Never fail the job: this is a diagnostic, the annotations are the result.
          exit 0

      - name: Report actor and token context
        run: |
          set -euo pipefail
          echo "::warning::CTX actor=${{ github.actor }} | repository_owner=${{ github.repository_owner }} | repository=${{ github.repository }}"

      # probe-3level pushed fine while action-test/action-test was denied, so the
      # namespace itself is writable and something is specific to that one name.
      # List what already exists to find out what.
      - name: List existing container packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          show() {
            label="$1"
            url="$2"
            set +e
            body=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                        -H "Accept: application/vnd.github+json" "$url")
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::PKG ${label} | curl rc=${rc}"
              return 0
            fi
            summary=$(printf '%s' "$body" | jq -r '
              if type=="array" then
                (map("\(.name)[vis=\(.visibility)][repo=\(.repository.name // "none")]") | join(" ; "))
              else
                "ERROR: " + (.message // "unknown")
              end' | tail -c 400)
            echo "::warning::PKG ${label} | ${summary}"
          }

          show "org-containers"  "https://api.github.com/orgs/duynhlab/packages?package_type=container&per_page=100"
          show "repo-linked"     "https://api.github.com/repos/duynhlab/action-test/packages?package_type=container"
